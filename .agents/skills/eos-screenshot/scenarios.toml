# Named screenshot recipes — invoked via `eos-screenshot --scenario <name>`.
# Add entries when an article reuses a shot across versions or when a shot
# becomes part of the EmptyOS site's recurring imagery.

[capability-inspector]
# The Simulate Capability Offline toggle lives in /settings under the LLM Routing section.
# Crop to that section so the toggle is shown in context.
url = "http://localhost:9000/settings/"
selector = '.section[data-section-title="llm routing"]'
wait_ms = 1500
out = "ai-relationship-simulate-offline-toggle"
alt = "Settings page — LLM Routing section with the Simulate Capability Offline dropdown"

[ai-offline-banner]
# Precondition: flip the setting once before running the skill —
#   curl -X POST http://localhost:9000/settings/api/set -H 'Content-Type: application/json' -d '{"key":"capability.simulate_offline","value":"all"}'
# The #eos-think-banner element is injected on page load when /api/think-status reports available:false.
url = "http://localhost:9000/journal/"
wait_ms = 1500
out = "ai-relationship-offline-banner"
alt = "Journal page with the AI offline banner shown — capability set to simulate offline, CRUD features still working"

[journal-default]
url = "http://localhost:9000/journal/"
out = "vault-under-ai-journal"
alt = "Journal — the daily ground state where notes get written"

[claude-md-skill]
url = "http://localhost:9000/system"
selector = "#claude-md-preview"
out = "vault-under-ai-skill"
alt = "A slice of EmptyOS's CLAUDE.md — plain prose that the AI reads at every session"

[staff-agents]
url = "http://localhost:9000/staff/"
out = "vault-under-ai-staff"
alt = "Staff — markdown-defined agents running on schedule"

# --- eos.binbian.net homepage shots ------------------------------------------
# These five shots land in {vault}/30_Resources/EmptyOS-Site/ and are referenced
# from index.md as the hero gallery. Refresh together when the UI shifts.
# Token in URL → middleware sets the cookie + clean-redirects on first hop.

[site-topology]
url = "http://localhost:9000/topology?token=zgmersGL0EeglgwfDw0A0xSapwgw3JuQJJis_kpS-eg"
wait_ms = 2000
prep = "if (typeof setView==='function') { setView('tree'); for (let i=0;i<60;i++) { const tv=document.getElementById('tree-view'); if (tv && tv.querySelector('.tree-leaf-g')) break; await new Promise(r=>setTimeout(r,250)); } }"
viewport_only = true
out = "eos-topology"
out_dir = "30_Resources/EmptyOS-Site"
alt = "System topology — every app and event in one live tree (capabilities → providers/apps → events)"

[site-aura]
url = "http://localhost:9000/voice-assistant/?token=zgmersGL0EeglgwfDw0A0xSapwgw3JuQJJis_kpS-eg"
wait_ms = 1500
viewport_only = true
prep = """
const t = document.getElementById('transcript');
if (t) {
  const ts = (m) => `<div class="turn-ts">11:3${m}</div>`;
  const body = (role, text) => `<div class="turn-body"><span class="turn-role">${role}</span>${text}</div>`;
  t.innerHTML = `
    <div class="turn turn-aura">${ts(0)}${body('Aura', "Hello. Press REC to speak — or hit ⌨ to type. I'll listen, think, and try to help without getting in the way.")}</div>
    <div class="turn turn-user">${ts(1)}${body('You', 'what can you do for me?')}</div>
    <div class="turn turn-aura">${ts(1)}${body('Aura', 'I can capture notes, log journal entries, pull up today\\'s tasks, or kick off research. What do you need?')}</div>
    <div class="turn turn-user">${ts(2)}${body('You', 'how many tasks do I have today?')}</div>
    <div class="turn turn-aura">${ts(2)}${body('Aura', '3 tasks on your list today. Top one is the focus block at 14:00.')}</div>
  `;
}
"""
out = "eos-aura"
out_dir = "30_Resources/EmptyOS-Site"
alt = "Voice assistant — talk to it, type to it, hands-free or tap-to-talk"

[site-focus]
url = "http://localhost:9000/focus/?token=zgmersGL0EeglgwfDw0A0xSapwgw3JuQJJis_kpS-eg"
wait_ms = 1500
viewport_only = true
out = "eos-focus"
out_dir = "30_Resources/EmptyOS-Site"
alt = "Focus timer — 25-minute sessions with a distraction-free fullscreen mode"

[site-journal]
url = "http://localhost:9000/journal/?token=zgmersGL0EeglgwfDw0A0xSapwgw3JuQJJis_kpS-eg"
wait_ms = 1500
viewport_only = true   # full-page leaks historical entries
blur = ".eos-personal, .te-text, .rd-preview, #entry-text, textarea, .today-entry"
out = "eos-journal"
out_dir = "30_Resources/EmptyOS-Site"
alt = "Journal — daily mood, free-write, and a year-at-a-glance heatmap"

[site-model-bench]
url = "http://localhost:9000/model-bench/?token=zgmersGL0EeglgwfDw0A0xSapwgw3JuQJJis_kpS-eg"
wait_ms = 1500
viewport_only = true
out = "eos-model-bench"
out_dir = "30_Resources/EmptyOS-Site"
alt = "Model Bench — benchmark every AI provider on real tasks side-by-side"
