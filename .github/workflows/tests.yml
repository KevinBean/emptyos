name: Tests
on: [push, pull_request]

jobs:
  test-collection:
    name: Validate test collection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # For the JS suite below (tests/js/*.test.mjs via node's built-in test
      # runner). No npm install, no browser — the shared page bundle is loaded
      # into a tiny sandbox and its PURE helpers are asserted. Pinned rather
      # than relying on whatever the runner image happens to ship.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install EmptyOS + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio pytest-playwright httpx

      - name: Collect system tests
        # Validates that all test files import and all fixtures resolve,
        # without needing a running EmptyOS daemon. Catches syntax errors,
        # missing imports, fixture typos, and helper regressions.
        run: pytest tests/ --ignore=tests/personal --collect-only -q

      - name: Check test marker registration
        # All @pytest.mark.* must be registered in pyproject.toml.
        # Fails the build if an unknown mark slipped in.
        run: pytest tests/ --ignore=tests/personal --collect-only -W error::pytest.PytestUnknownMarkWarning -q

      - name: Run offline architecture guards
        # These checks exercise manifest contracts and loaders without a daemon.
        run: |
          python -m pytest \
            tests/test_unit_app_builder_inspect.py \
            tests/test_manifest_deps.py \
            tests/test_unit_app_loader.py \
            tests/test_unit_topology_analysis.py \
            tests/test_sdk_demand_log.py \
            tests/test_unit_app_imports.py \
            tests/test_unit_privacy_patterns.py \
            tests/test_unit_js_suite.py \
            -q

      - name: Check app tree and release tiers
        run: python scripts/check-tier-folder.py

      - name: Generated docs up to date (APPS.md / TIERS.md)
        # Regenerate from manifests + release.toml + the tracked
        # docs/doc-summaries.json cache and fail if the committed docs drifted.
        # Static-only, deterministic in a clean checkout — no daemon.
        run: python scripts/preflight.py --scope docs

      - name: iOS safe-area scanner
        # Catches the 5 iOS bug families documented at the top of
        # scripts/check-ios-safe-area.py: notch overlap, home-indicator overlap,
        # hardcoded notch padding, 100vh viewport collapse, and
        # div-onclick-without-cursor:pointer (iOS Safari silently drops those).
        # Static-only — no daemon, runs in <1s. Sister to test_sys_ios_layout.py.
        run: python scripts/check-ios-safe-area.py

      - name: Lint — real bugs only (F821 + F811 + E9)
        # F821 = undefined name (will crash on the path), F811 = redefined-
        # while-unused (silently shadows earlier defs), E9 = SyntaxError.
        # The wider rule set lives in pyproject.toml [tool.ruff.lint] and
        # is run locally / opt-in; CI still gates on real-crash bugs only
        # until the ~200 remaining violations (B904, ASYNC*, …) are triaged.
        run: |
          pip install ruff
          ruff check --select F821,F811,E9 emptyos apps plugins services scripts

      - name: Format check (ruff format)
        # Non-blocking until the existing format backlog is cleared in one
        # dedicated pass. Keep surfacing drift without mixing a repo-wide
        # rewrite into functional changes.
        continue-on-error: true
        run: ruff format --check emptyos apps plugins services scripts

      - name: Lint — wider rule set (non-blocking)
        # Runs the full config in pyproject.toml [tool.ruff.lint]. Stays
        # non-blocking until the stylistic tail is fully cleared — the
        # narrow F821/F811/E9 gate above is the real-bug blocker.
        continue-on-error: true
        run: ruff check emptyos apps plugins services scripts

      - name: Dependency vulnerability audit (pip-audit)
        # Non-blocking: known-vuln deps surface as build warnings, not
        # failures, so an upstream advisory doesn't block unrelated PRs.
        # Promote to a hard fail once the inventory is clean.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --strict --progress-spinner off || true

  api-tests:
    name: API tests (tier 2, daemon-up)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default depth-1. `_topology_timeline`
          # (emptyos/web/topology.py) derives each node's birth date from
          # `git log --diff-filter=A --follow -- <manifest.toml>`, falling back
          # to filesystem mtime. On a shallow clone BOTH collapse to the
          # checkout instant, so every node lands on `max_date` and is hidden
          # at every timeline cutoff — which is exactly what
          # test_timeline_dates_foundation_layers asserts against. It failed
          # ONLY in CI for this reason (homepc has full history), and the
          # derivation is correct; the shallow clone was lying to it.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install EmptyOS + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio pytest-playwright pytest-timeout pytest-rerunfailures httpx

      - name: Set up throwaway vault
        run: |
          mkdir -p ./ci-vault/50_Journal/2026
          mkdir -p ./ci-vault/10_Projects
          mkdir -p ./ci-vault/30_Resources/Items
          mkdir -p ./ci-vault/30_Resources/Places
          mkdir -p ./ci-vault/30_Resources/Recipes
          mkdir -p ./ci-vault/00_Inbox

      - name: Write CI emptyos.toml
        run: |
          cat > emptyos.toml <<'EOF'
          [os]
          name = "EmptyOS CI"
          data_dir = "./data"
          log_level = "WARNING"

          [notes]
          # ABSOLUTE on purpose. A relative vault path is legitimate config and
          # the product now handles it (every consumer goes through
          # `Config.notes_path`, which resolves), but it is the single condition
          # that separated CI from homepc and from a sandbox member — both of
          # those use absolute paths, which is why seven failures reproduced
          # nowhere and sat undiagnosed. Keeping CI absolute removes the
          # divergence; `tests/test_unit_notes_path_resolution.py` is what keeps
          # the relative case honest, rather than leaving CI as its only cover.
          path = "${{ github.workspace }}/ci-vault"
          watch = true

          [network]
          mode = "local"
          port = 9000

          # CI must never reach a cloud provider: no spend, no network flake, no
          # text leaving the runner. "never" also RETURNS IMMEDIATELY
          # (consent.py: `if self.policy == "never": return False`), where the
          # default "ask" emits a consent request and waits DEFAULT_TIMEOUT_
          # SECONDS = 120 for a modal nobody can answer headlessly.
          #
          # That default became load-bearing on 2026-09-16, when edge-tts
          # correctly declared `trust = "service"` — it had been posing as local,
          # so every line of text skipped the gate. Reclassifying it put `speak`
          # behind the gate, and 10 soundcheck / dictionary tests then hung past
          # the 60s test timeout as httpx.ReadTimeout. With "never" the chain
          # skips the cloud provider at once and the apps take the
          # no-provider path they are written for.
          [cloud]
          consent = "never"

          [scheduler]
          enabled = true
          timezone = "UTC"

          [apps]
          path = "./apps"
          autostart = []

          [plugins]
          path = "./plugins"
          EOF

      - name: Boot EmptyOS daemon
        run: |
          python -m emptyos start > eos.log 2>&1 &
          echo $! > eos.pid

      - name: Wait for daemon health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9000/api/health > /dev/null; then
              echo "Daemon healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Daemon never became healthy. Tail of log:"
          tail -80 eos.log
          exit 1

      - name: Run API tests (no LLM, no Playwright)
        # Tier 2 — exercises every app's HTTP surface against the live daemon.
        # Excludes interactive (Playwright UI) and llm (cost-bearing) tests.
        # -v (not -q) so a hang names the test it stalled on: pytest writes the
        # nodeid before running the item, so the last log line IS the culprit.
        # With -q the run stalls mid-dots and the test is unidentifiable.
        run: pytest tests/ --ignore=tests/personal -m "api and not llm and not interactive and not slow" -v --timeout=60 --reruns 2

      - name: Shut down daemon
        if: always()
        run: |
          if [ -f eos.pid ]; then
            kill $(cat eos.pid) 2>/dev/null || true
          fi

      - name: Upload daemon log on failure
        # always(), not failure(): a job killed by `timeout-minutes` is
        # CANCELLED, not failed, so failure() skips the upload and a hang
        # leaves no evidence at all. Verified on run 34445735814.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eos-daemon-log-api
          path: eos.log
          retention-days: 7
