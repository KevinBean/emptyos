<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Plekto — concept B: woven strands</title>
  <desc>Three strands woven into a square, alternating over/under like the simplest twill. Most literal interpretation of πλέκω. Reads as "structure" rather than "logo" at favicon size — works best 24px+.</desc>

  <g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Horizontal strand 1 (top) -->
    <path d="M 24 44 L 104 44"/>
    <!-- Horizontal strand 2 (middle) -->
    <path d="M 24 64 L 104 64"/>
    <!-- Horizontal strand 3 (bottom) -->
    <path d="M 24 84 L 104 84"/>

    <!-- Vertical strand 1 (left): goes UNDER top, OVER middle, UNDER bottom -->
    <path d="M 44 24 L 44 40"/>
    <path d="M 44 48 L 44 60"/>
    <path d="M 44 68 L 44 80"/>
    <path d="M 44 88 L 44 104"/>

    <!-- Vertical strand 2 (centre): goes OVER top, UNDER middle, OVER bottom -->
    <path d="M 64 24 L 64 104"/>
    <!-- (centre passes over all three horizontals — strongest spine, anchors the mark) -->

    <!-- Vertical strand 3 (right): goes UNDER top, OVER middle, UNDER bottom -->
    <path d="M 84 24 L 84 40"/>
    <path d="M 84 48 L 84 60"/>
    <path d="M 84 68 L 84 80"/>
    <path d="M 84 88 L 84 104"/>
  </g>
</svg>
