<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Plekto — B1-cross: two accent threads forming a plus</title>
  <desc>Same 3x3 weave but with BOTH V2 (centre vertical) and H2 (centre horizontal) in accent teal — they cross at the centre. Reads as "the binding threads" rather than "the spine". More visual weight in the accent without losing the weave context.</desc>

  <g fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">

    <!-- Neutral weave (slate) -->
    <g stroke="#475569">
      <!-- H1 + H3 (top + bottom horizontals) continuous -->
      <path d="M 16 44 L 112 44"/>
      <path d="M 16 84 L 112 84"/>
      <!-- V1 (left), broken at every horizontal — passes UNDER -->
      <path d="M 44 16 L 44 40"/>
      <path d="M 44 48 L 44 60"/>
      <path d="M 44 68 L 44 80"/>
      <path d="M 44 88 L 44 112"/>
      <!-- V3 (right), same broken pattern -->
      <path d="M 84 16 L 84 40"/>
      <path d="M 84 48 L 84 60"/>
      <path d="M 84 68 L 84 80"/>
      <path d="M 84 88 L 84 112"/>
    </g>

    <!-- Accent cross (teal) -->
    <g stroke="#0f766e">
      <!-- H2 centre horizontal — OVER V1, OVER V3, continuous (passes on top) -->
      <path d="M 16 64 L 112 64"/>
      <!-- V2 centre vertical — OVER all horizontals, but UNDER H2 (since H2 is also continuous it crosses on top here visually) -->
      <!-- To make both visible and reinforce "cross", V2 is broken at H2 — V2 goes UNDER the accent horizontal at the centre intersection -->
      <path d="M 64 16 L 64 60"/>
      <path d="M 64 68 L 64 112"/>
    </g>

  </g>
</svg>
