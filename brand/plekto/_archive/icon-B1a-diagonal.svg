<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Plekto — B1a-diagonal: amber diagonal thread through weave</title>
  <desc>Same 3x3 slate weave (no V2 highlight this time — V2 stays neutral too, all 6 strands cool grey) plus a single amber diagonal stroke from top-left to bottom-right. The diagonal cuts through the rectilinear weave like a binding thread or a needle. Adds movement and asymmetry that the vertical/horizontal variants don't have.</desc>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- Full neutral 3x3 weave (all 6 strands slate) -->
    <g stroke="#475569" stroke-width="9">
      <!-- 3 horizontals (continuous) -->
      <path d="M 16 44 L 112 44"/>
      <path d="M 16 64 L 112 64"/>
      <path d="M 16 84 L 112 84"/>
      <!-- 3 verticals (broken at each horizontal — under) -->
      <path d="M 44 16 L 44 40"/>
      <path d="M 44 48 L 44 60"/>
      <path d="M 44 68 L 44 80"/>
      <path d="M 44 88 L 44 112"/>
      <path d="M 64 16 L 64 40"/>
      <path d="M 64 48 L 64 60"/>
      <path d="M 64 68 L 64 80"/>
      <path d="M 64 88 L 64 112"/>
      <path d="M 84 16 L 84 40"/>
      <path d="M 84 48 L 84 60"/>
      <path d="M 84 68 L 84 80"/>
      <path d="M 84 88 L 84 112"/>
    </g>

    <!-- Amber diagonal: top-left toward bottom-right, drawn on top of the weave.
         Slightly inset from the edges so it doesn't run off-canvas. -->
    <g stroke="#d97706" stroke-width="11">
      <path d="M 22 22 L 106 106"/>
    </g>

  </g>
</svg>
