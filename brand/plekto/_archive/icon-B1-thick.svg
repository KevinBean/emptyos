<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Plekto — B1-thick: accent spine with extra weight</title>
  <desc>Same as B1 but the accent spine is rendered thicker (13px vs 9px for the neutral strands). Emphasis through weight as well as colour — the spine reads as "the strong thread". Hierarchy is clearer at small sizes where colour contrast alone gets washed out.</desc>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- Neutral weave (slate, 9px) -->
    <g stroke="#475569" stroke-width="9">
      <path d="M 16 44 L 112 44"/>
      <path d="M 16 64 L 112 64"/>
      <path d="M 16 84 L 112 84"/>
      <path d="M 44 16 L 44 40"/>
      <path d="M 44 48 L 44 60"/>
      <path d="M 44 68 L 44 80"/>
      <path d="M 44 88 L 44 112"/>
      <path d="M 84 16 L 84 40"/>
      <path d="M 84 48 L 84 60"/>
      <path d="M 84 68 L 84 80"/>
      <path d="M 84 88 L 84 112"/>
    </g>

    <!-- Accent spine (teal, 13px — 44% thicker) -->
    <g stroke="#0f766e" stroke-width="13">
      <path d="M 64 14 L 64 114"/>
    </g>

  </g>
</svg>
