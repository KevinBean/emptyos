<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Plekto — B1a-cross: two amber threads forming a plus</title>
  <desc>B1-cross geometry (V2 + H2 both accent) in amber instead of teal. Two binding threads meeting at the centre. Same weave context, two-thread emphasis.</desc>

  <g fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">

    <!-- Neutral weave (slate) -->
    <g stroke="#475569">
      <path d="M 16 44 L 112 44"/>
      <path d="M 16 84 L 112 84"/>
      <path d="M 44 16 L 44 40"/>
      <path d="M 44 48 L 44 60"/>
      <path d="M 44 68 L 44 80"/>
      <path d="M 44 88 L 44 112"/>
      <path d="M 84 16 L 84 40"/>
      <path d="M 84 48 L 84 60"/>
      <path d="M 84 68 L 84 80"/>
      <path d="M 84 88 L 84 112"/>
    </g>

    <!-- Accent cross (amber) — H2 continuous, V2 broken at centre for visible cross -->
    <g stroke="#d97706">
      <path d="M 16 64 L 112 64"/>
      <path d="M 64 16 L 64 60"/>
      <path d="M 64 68 L 64 112"/>
    </g>

  </g>
</svg>
