<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Plekto — B1: 3x3 weave with accent centre spine</title>
  <desc>Original 3x3 twill weave geometry. The centre vertical strand (V2 — the over-strand, the spine) is rendered in accent teal; the other 8 strands are slate. Reads as "one thread holds the rest together" — minimal hint of structure without forming a letter.</desc>

  <g fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">

    <!-- ─── Neutral weave (slate) ──────────────────────────── -->
    <g stroke="#475569">
      <!-- Three horizontals — continuous lines (they're the over-strands except where V2 crosses) -->
      <path d="M 16 44 L 112 44"/>
      <path d="M 16 64 L 112 64"/>
      <path d="M 16 84 L 112 84"/>
      <!-- V1 (left), broken into 4 segments — passes UNDER each horizontal -->
      <path d="M 44 16 L 44 40"/>
      <path d="M 44 48 L 44 60"/>
      <path d="M 44 68 L 44 80"/>
      <path d="M 44 88 L 44 112"/>
      <!-- V3 (right), broken same way -->
      <path d="M 84 16 L 84 40"/>
      <path d="M 84 48 L 84 60"/>
      <path d="M 84 68 L 84 80"/>
      <path d="M 84 88 L 84 112"/>
    </g>

    <!-- ─── Accent spine (teal) ────────────────────────────── -->
    <!-- V2 centre vertical is the OVER-strand — continuous, passes on top of all horizontals -->
    <g stroke="#0f766e">
      <path d="M 64 16 L 64 112"/>
    </g>

  </g>
</svg>
