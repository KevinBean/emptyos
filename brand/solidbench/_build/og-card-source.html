<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background:
      linear-gradient(rgba(35,35,32,0.055) 1px, transparent 1px) 0 0 / 100% 32px,
      linear-gradient(90deg, rgba(35,35,32,0.055) 1px, transparent 1px) 0 0 / 32px 100%,
      #F0EFE6;
    font-family: "IBM Plex Sans", sans-serif;
    color: #232320;
    position: relative;
  }
  .frame {
    position: absolute; inset: 36px;
    border: 2px solid #9E9B87;
  }
  .tag {
    position: absolute; top: 36px; right: 36px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 15px; letter-spacing: 0.1em; color: #5B5B52;
    border: 1px solid #9E9B87; padding: 5px 12px;
  }
  .wrap { position: absolute; left: 90px; top: 150px; width: 760px; }
  .eyebrow {
    font-family: "IBM Plex Mono", monospace; font-size: 19px;
    letter-spacing: 0.16em; text-transform: uppercase; color: #E05A1E;
    display: flex; align-items: center; gap: 14px; margin-bottom: 22px;
  }
  .eyebrow::before { content: ""; width: 34px; height: 2px; background: #E05A1E; display: inline-block; }
  h1 {
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 800; text-transform: uppercase; letter-spacing: 0.01em;
    font-size: 92px; line-height: 0.92; margin: 0 0 26px;
  }
  h1 em { font-style: normal; color: #E05A1E; }
  p {
    font-family: "IBM Plex Sans", sans-serif; font-size: 25px;
    line-height: 1.5; color: #5B5B52; margin: 0; max-width: 640px;
  }
  .diagram { position: absolute; right: 70px; bottom: 60px; opacity: 0.9; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="frame"></div>
  <div class="tag">DWG SB&#8209;01</div>
  <div class="wrap">
    <div class="eyebrow">Parametric CAD, drafted by description</div>
    <h1>From a sentence<br>to a <em>solid</em>.</h1>
    <p>SolidBench &mdash; natural-language generation, geometry&#8209;checked,
       Git&#8209;versioned, exportable to STEP.</p>
  </div>
  <svg class="diagram" width="230" height="170" viewBox="0 0 400 300" aria-hidden="true">
    <line x1="70" y1="40" x2="70" y2="260" stroke="#9E9B87" stroke-width="4"/>
    <line x1="70" y1="150" x2="230" y2="150" stroke="#9E9B87" stroke-width="4"/>
    <line x1="230" y1="150" x2="230" y2="90" stroke="#9E9B87" stroke-width="4"/>
    <line x1="230" y1="150" x2="230" y2="220" stroke="#9E9B87" stroke-width="4"/>
    <circle cx="70" cy="60" r="14" fill="#E05A1E"/>
    <circle cx="70" cy="150" r="14" fill="#232320"/>
    <circle cx="70" cy="240" r="14" fill="#232320"/>
    <circle cx="230" cy="90" r="14" fill="#E05A1E"/>
    <circle cx="230" cy="220" r="14" fill="#E05A1E"/>
  </svg>
</body>
</html>
