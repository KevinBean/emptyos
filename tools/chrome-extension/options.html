<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>EmptyOS Extension Settings</title>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 20px; background: #1a1a1a; color: #eee; }
  h1 { font-size: 18px; }
  label { display: block; margin-top: 16px; font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: .05em; }
  input { width: 100%; padding: 8px; margin-top: 4px; background: #0f0f0f; color: #eee; border: 1px solid #333; border-radius: 4px; font: inherit; box-sizing: border-box; }
  button { margin-top: 16px; padding: 8px 16px; background: #4a7; color: #000; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
  .status { margin-top: 12px; font-size: 12px; color: #888; }
  .status.ok { color: #4a7; }
  .status.err { color: #d66; }
  .hint { font-size: 11px; color: #888; margin-top: 4px; }
</style>
</head>
<body>
<h1>EmptyOS Extension Settings</h1>

<label for="name">Your name (for greeting)</label>
<input type="text" id="name" placeholder="Bin">

<label for="host">Daemon URL</label>
<input type="text" id="host" placeholder="http://localhost:9000">
<div class="hint">No trailing slash. Use your Tailscale/private host if not on localhost.</div>

<label for="token">Auth token</label>
<input type="password" id="token" placeholder="emptyos.toml [network] auth_token">
<div class="hint">Required when network.mode is "private" or "public". Leave blank for local mode.</div>

<button id="save">Save</button>
<button id="test" style="background: #2a2a2a; color: #eee;">Test connection</button>
<div class="status" id="status"></div>

<script src="options.js"></script>
</body>
</html>
