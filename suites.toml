# suites.toml — the EmptyOS suite catalog (single source of truth)
#
# THE EMPTYOS STACK
#   Distributions  — the boxes that ship (release.toml tiers + targets)
#   Suites         — named product chapters users digest (THIS FILE)
#   Apps           — surface apps (one per suite, compose, own no data)
#                    + atom apps (single-purpose, own their data + verbs)
#   Engines        — pure math libraries
#   Platform       — kernel · capabilities · EventBus · vault · plugins · SDK
#
# A *distribution* is the box that ships; a *suite* is a named chapter inside
# the box, reused across distributions. This file is DESCRIPTIVE ONLY:
# - the kernel never reads it (all apps stay equal at runtime);
# - release tiers stay literal app lists (no component resolution);
# - docs / brand copy / launcher presentation derive from it, never the reverse.
#
# Fields per [[suite]]:
#   id       — stable slug (also the contribution-slot namespace for its surface
#              app, e.g. [[contributes.life.timeline]])
#   name     — user-facing name (descriptive, per brand voice: specific over grand)
#   line     — "consumer" | "engineer"
#   pitch    — one line, EN;  pitch_zh — one line, 中文 (never mixed on a surface)
#   surface  — app id of the suite's front door ("" until one exists; prefer
#              promoting an existing member over creating a new app)
#   apps     — member atom-app ids (public/tracked only; apps/personal/ never
#              appears here). An app MAY belong to more than one suite (kb).
#
# chrome = platform/meta/utility apps that are deliberately in NO suite —
# suites market features, not plumbing. scripts/check_suites.py validates that
# every listed id resolves to a real manifest and reports tracked public apps
# that are neither in a suite nor in chrome.

version = 1

chrome = [
    "hub",
    "settings",
    "store",
    "providers",
    "system-log",
    "billing",
    "tour",
    "app-analytics",
    "vault-backup",
    "run",
    "weather",
    "geocode",
    "routing",
    "workspaces",
    "model-serving",
    "feedback",
    "gesture",
    "engagements",
]

