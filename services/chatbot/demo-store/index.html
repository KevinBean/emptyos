<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Northstar Office · Printer pilot</title><style>:root{--accent:#635bff;--accent-bg:#eeecff;--bg:#f6f7f9;--bg-card:#fff;--border:#dde1e7;--text:#20242b;--text-heading:#11151b;--text-muted:#6b7280}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}header{background:#171a21;color:white;padding:14px 5vw;display:flex;justify-content:space-between}.hero{padding:55px 5vw 32px;background:linear-gradient(120deg,#fff,#efefff)}h1{font-size:clamp(34px,6vw,64px);max-width:850px;line-height:1;margin:0 0 15px}.hero p{font-size:18px;color:#555;max-width:650px}.grid{padding:28px 5vw 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.card{background:white;border:1px solid var(--border);border-radius:12px;padding:16px}.art{height:110px;border-radius:8px;background:linear-gradient(135deg,#eceef3,#d9dcec);display:grid;place-items:center;font-size:40px}.card h2{font-size:15px;margin:12px 0 5px}.price{font-size:18px;font-weight:700}.stock{font-size:12px;color:#16844b;margin-top:4px}</style></head><body><header><b>Northstar Office</b><span>Controlled shopping-assistant pilot</span></header><section class="hero"><h1>Printers for work that needs doing.</h1><p>Browse the synthetic catalogue or ask the assistant to find Wi-Fi, duplex, colour, mono, laser, and budget options.</p></section><main class="grid" id="grid"></main><script>fetch('{{BASE}}/demo-store/catalog.json').then(r=>r.json()).then(d=>{document.getElementById('grid').innerHTML=d.products.slice(0,24).map(p=>`<article class="card" id="product-${p.id}"><div class="art">▣</div><h2>${p.title}</h2><div class="price">${p.price.currency} $${p.price.amount.toFixed(2)}</div><div class="stock">${p.availability.replaceAll('_',' ')}</div></article>`).join('')})</script><script src="{{BASE}}/widget/chatbot-widget.js" data-chatbot-site="printer-pilot" data-chatbot-endpoint="" defer></script><script>document.currentScript.previousElementSibling.dataset.chatbotEndpoint=location.origin+"{{BASE}}"</script></body></html>
