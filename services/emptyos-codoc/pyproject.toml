[project]
name = "emptyos-codoc"
version = "0.1.0"
description = "EmptyOS live collaboration service — ACL-gated real-time document relay (Lane 1)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pycrdt>=0.10",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["emptyos_codoc*"]

[tool.setuptools.package-data]
emptyos_codoc = ["web/*.html"]
