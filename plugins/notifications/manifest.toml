[plugin]
id = "notifications"
name = "Notifications"
version = "1.0.0"
description = "Proactive notifications — vault file by default, Telegram when configured"
default = true

[plugin.entry]
module = "plugin"
class = "NotificationsPlugin"

[provides]
services = ["notifications"]
tags = ["system", "messaging"]

# Fired after a notification is delivered on any channel. No listener today —
# declared so delivery is visible in the topology graph.
[provides.events]
emits = ["notification:sent"]

[platforms]
supports = ["laptop", "vps-cpu", "vps-gpu", "docker"]
