[plugin]
id = "system-tray"
name = "System Tray"
version = "1.0.0"
description = "Adds EmptyOS to the native Windows/macOS system tray"
# Off on a fresh install: it adds a system tray icon.
default_enabled = false

[plugin.entry]
module = "plugin"
class = "SystemTrayPlugin"

[provides]
services = ["system-tray"]
tags = ["desktop", "ui"]

# Tray menu click — a real cross-app trigger with a live listener.
[provides.events]
emits = ["tray:capture_clicked"]
