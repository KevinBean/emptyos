<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>App Analytics - EmptyOS</title>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/eos-components.css">
<style>
.aa-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px; }
@media (max-width:800px) { .aa-grid-2 { grid-template-columns:1fr; } }
.aa-card { background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:16px 16px; }
.aa-card-title { font-size:12px; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:12px; }
.aa-table { width:100%; border-collapse:collapse; font-size:13px; }
.aa-table th { text-align:left; color:var(--text-muted); font-size:11px; text-transform:uppercase; letter-spacing:var(--tracking-meta); padding:8px 8px; border-bottom:1px solid var(--border); }
.aa-table td { padding:8px 8px; border-bottom:1px solid var(--border); }
.aa-table .num { text-align:right; font-variant-numeric:tabular-nums; }
.aa-table tr.danger td { color:var(--danger); }
.aa-tod { display:flex; gap:2px; align-items:flex-end; height:60px; }
.aa-tod-bar { flex:1; background:var(--accent); border-radius:4px 4px 0 0; min-width:8px; transition:height 0.3s; position:relative; }
.aa-tod-bar:hover::after { content:attr(data-tip); position:absolute; bottom:100%; left:50%; transform:translateX(-50%); background:var(--bg-card); border:1px solid var(--border); padding:2px 8px; border-radius:4px; font-size:10px; white-space:nowrap; }
.aa-tod-labels { display:flex; gap:2px; }
.aa-tod-labels span { flex:1; text-align:center; font-size:10px; color:var(--text-muted); min-width:8px; }
.aa-heatmap-wrap { margin-top:8px; }
/* Productivity split. Colour is theme-tuned and never the only signal —
   every segment is named in the legend and every row carries a text badge. */
.aa-pr-head { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
.aa-pr-pct { font-size:30px; font-weight:700; color:var(--success); font-variant-numeric:tabular-nums; }
.aa-pr-sub { font-size:13px; color:var(--text-secondary); }
.aa-pr-track { display:flex; height:14px; border-radius:8px; overflow:hidden; background:var(--bg-card); border:1px solid var(--border); }
.aa-pr-seg { height:100%; }
.aa-pr-seg-productive { background:var(--success); }
.aa-pr-seg-neutral { background:var(--text-muted); }
.aa-pr-seg-personal { background:var(--info); }
.aa-pr-legend { display:flex; gap:14px; flex-wrap:wrap; margin-top:8px; font-size:12px; color:var(--text-secondary); }
.aa-pr-key { display:inline-block; width:10px; height:10px; border-radius:4px; margin-right:5px; vertical-align:middle; }
.aa-pr-days { display:flex; gap:2px; align-items:flex-end; height:56px; margin-top:14px; }
.aa-pr-day { flex:1; min-width:4px; display:flex; flex-direction:column-reverse; height:100%; justify-content:flex-start; }
.aa-pr-day-seg { width:100%; }
.aa-pr-select { padding:3px 6px; background:var(--bg-card); border:1px solid var(--border); color:var(--text); border-radius:6px; font-size:12px; }
.aa-app-select { padding:4px 8px; background:var(--bg-card); border:1px solid var(--border); color:var(--text); border-radius:6px; font-size:12px; margin-left:8px; }
.aa-streak-bar { display:inline-block; height:10px; background:var(--accent); border-radius:4px; min-width:2px; }
/* Vault tab styles */
.va-hero { display:flex; gap:12px; margin-bottom:24px; margin-top:16px; }
.va-hero-card { flex:1; background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:16px; text-align:center; }
.va-hero-val { font-size:28px; font-weight:700; color:var(--accent); }
.va-hero-lbl { font-size:13px; color:var(--text-secondary); margin-top:4px; }
.va-para-bar { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
.va-para-label { width:100px; font-size:14px; font-weight:500; text-align:right; flex-shrink:0; }
.va-para-track { flex:1; height:24px; background:var(--bg-card); border:1px solid var(--border); border-radius:6px; overflow:hidden; position:relative; }
.va-para-fill { height:100%; background:var(--accent); border-radius:6px; }
.va-para-count { font-size:13px; color:var(--text-secondary); width:70px; flex-shrink:0; }
.va-file-list { background:var(--bg-card); border:1px solid var(--border); border-radius:14px; overflow:hidden; font-size:14px; max-height:360px; overflow-y:auto; }
.va-file-item { display:flex; justify-content:space-between; padding:8px 12px; border-top:1px solid var(--border); }
.va-file-item:first-child { border-top:none; }
.va-file-item:hover { background:color-mix(in srgb, var(--bg-card) 95%, var(--accent) 5%); }
.va-file-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; margin-right:12px; }
.va-file-meta { color:var(--text-secondary); font-family:'SF Mono',Consolas,monospace; font-size:13px; flex-shrink:0; }
.va-section-title { font-size:18px; font-weight:600; color:var(--text-heading, var(--text)); margin:24px 0 12px; }
.va-empty { text-align:center; padding:32px; color:var(--text-secondary); }
.va-structure-panel { background:var(--bg-card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-top:16px; }
.va-structure-status { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:12px; }
.va-structure-meta { color:var(--text-secondary); font-size:13px; }
.va-structure-actions { display:flex; gap:8px; flex-wrap:wrap; }
</style>
</head>
<body>
<script src="/static/realtime.js"></script>
<script src="/static/eos.js"></script>
<script src="/static/eos-components.js"></script>
<script>EOS.nav('app-analytics');</script>

<div class="page">
    <div class="eos-header">
        <div>
            <h1>App Analytics</h1>
            <div style="font-size:13px;color:var(--text-secondary);margin-top:2px">Usage tracking + vault health. Informs what to build next.</div>
        </div>
        <button class="btn-settings" onclick="openAppSettings()" title="Settings">&#9881; Settings</button>
    </div>

    <div class="eos-tabs" style="margin-bottom:16px">
        <div class="eos-tab active" data-tab="usage" onclick="EOS_UI.switchTab('usage')">Usage</div>
        <div class="eos-tab" data-tab="vault" onclick="EOS_UI.switchTab('vault'); loadVault()">Vault</div>
    </div>

    <div id="tab-usage" class="eos-tab-content active">
        <div id="aa-stats" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px"></div>
        <div id="aa-productivity"></div>
        <div class="aa-card" id="aa-digest-card" style="margin-top:16px">
            <div class="aa-card-title" style="display:flex;justify-content:space-between;align-items:center">
                <span>This week</span>
                <span style="display:flex;gap:8px;align-items:center">
                    <span id="aa-model-pill"></span>
                    <button class="eos-btn eos-btn-sm" onclick="loadDigest()">&#10024; Summarize</button>
                </span>
            </div>
            <div id="aa-digest-text" style="font-size:14px;color:var(--text-secondary);line-height:1.6"></div>
        </div>
        <div id="aa-content"></div>
    </div>

    <div id="tab-vault" class="eos-tab-content">
        <div id="va-content"><div class="va-empty">Loading vault data...</div></div>
    </div>
</div>

<script>
function esc(s) { return EOS_UI.esc(String(s == null ? '' : s)); }

/* ═══════════════ USAGE TAB ═══════════════ */

async function loadDigest() {
    var box = document.getElementById('aa-digest-text');
    box.textContent = 'Summarizing this week…';
    try {
        var d = await EOS.api('/app-analytics/api/digest');
        box.textContent = d.digest || 'Not enough usage this week for a summary.';
    } catch(e) {
        box.textContent = 'Could not generate a summary — an AI provider may be unavailable.';
    }
}

async function loadUsage() {
    try {
        var [summary, unused, errors, tod, streaks] = await Promise.all([
            EOS.api('/app-analytics/api/summary'),
            EOS.api('/app-analytics/api/unused?days=30'),
            EOS.api('/app-analytics/api/errors-vs-usage?days=30'),
            EOS.api('/app-analytics/api/time-of-day?days=30'),
            EOS.api('/app-analytics/api/streaks'),
        ]);
        renderUsage(summary, unused, errors, tod, streaks);
    } catch(e) {
        document.getElementById('aa-content').innerHTML = EOS_UI.errorState({message: 'Failed to load — is the daemon running?', onRetry: 'loadUsage()'});
    }
}

function renderUsage(summary, unused, errors, tod, streaks) {
    setTimeout(function() {
        EOS_UI.statCards('aa-stats', [
            { label: 'Views today', value: summary.views_today },
            { label: 'Views (7d)', value: summary.views_7d },
            { label: 'Active apps (7d)', value: summary.active_apps_7d },
            { label: 'Unused (30d)', value: summary.unused_apps_30d, variant: summary.unused_apps_30d > 10 ? 'warning' : 'accent' },
        ]);
    }, 10);

    var todMax = Math.max(1, ...Object.values(tod));
    var todBars = '';
    var todLabels = '';
    for (var h = 0; h < 24; h++) {
        var k = String(h).padStart(2, '0');
        var v = tod[k] || 0;
        var pct = Math.max(2, Math.round(v / todMax * 56));
        todBars += '<div class="aa-tod-bar" style="height:' + pct + 'px" data-tip="' + k + ':00 — ' + v + '"></div>';
        todLabels += '<span>' + (h % 3 === 0 ? k : '') + '</span>';
    }

    var unusedHtml = '';
    if (unused.length === 0) {
        unusedHtml = '<div style="color:var(--text-muted);font-size:12px">All apps were used in the last 30 days.</div>';
    } else {
        unusedHtml = '<table class="aa-table"><tr><th>App</th><th>Last seen</th><th class="num">Days ago</th></tr>';
        unused.slice(0, 15).forEach(function(r) {
            unusedHtml += '<tr><td>' + esc(r.name || r.app_id) + '</td><td>' + esc(r.last_seen || 'never') + '</td><td class="num">' + (r.days_ago != null ? r.days_ago : '—') + '</td></tr>';
        });
        unusedHtml += '</table>';
        if (unused.length > 15) unusedHtml += '<div style="font-size:11px;color:var(--text-muted);margin-top:4px">+' + (unused.length - 15) + ' more</div>';
    }

    var errHtml = '';
    var errRows = errors.filter(function(r) { return r.errors > 0; });
    if (errRows.length === 0) {
        errHtml = EOS_UI.emptyState({message:'No errors in the last 30 days.'});
    } else {
        errHtml = '<table class="aa-table"><tr><th>App</th><th class="num">Views</th><th class="num">Events</th><th class="num">Errors</th><th class="num">Priority</th></tr>';
        errRows.slice(0, 15).forEach(function(r) {
            var cls = r.priority > 5 ? ' class="danger"' : '';
            errHtml += '<tr' + cls + '><td>' + esc(r.app) + '</td><td class="num">' + r.views + '</td><td class="num">' + r.events + '</td><td class="num">' + r.errors + '</td><td class="num">' + r.priority + '</td></tr>';
        });
        errHtml += '</table>';
    }

    var topStreaks = streaks.filter(function(r) { return r.current_weeks > 0; }).slice(0, 10);
    var streakHtml = '';
    if (topStreaks.length === 0) {
        streakHtml = EOS_UI.emptyState({message:'No active weekly streaks yet.'});
    } else {
        var maxStreak = Math.max(1, ...topStreaks.map(function(r) { return r.current_weeks; }));
        streakHtml = '<table class="aa-table"><tr><th>App</th><th class="num">Current</th><th class="num">Longest</th><th>Streak</th></tr>';
        topStreaks.forEach(function(r) {
            var w = Math.max(8, Math.round(r.current_weeks / maxStreak * 100));
            streakHtml += '<tr><td>' + esc(r.app) + '</td><td class="num">' + r.current_weeks + 'w</td><td class="num">' + r.longest_weeks + 'w</td><td><div class="aa-streak-bar" style="width:' + w + 'px"></div></td></tr>';
        });
        streakHtml += '</table>';
    }

    var activeApps = errors.filter(function(r) { return r.views > 0 || r.events > 0; }).map(function(r) { return r.app; });
    var heatmapOpts = activeApps.map(function(a) { return '<option value="' + escAttr(a) + '">' + esc(a) + '</option>'; }).join('');

    document.getElementById('aa-content').innerHTML =
        '<div class="aa-grid-2">' +
            '<div class="aa-card"><div class="aa-card-title">What to delete (unused 30d)</div>' + unusedHtml + '</div>' +
            '<div class="aa-card"><div class="aa-card-title">What to fix (errors vs usage)</div>' + errHtml + '</div>' +
        '</div>' +
        '<div class="aa-grid-2">' +
            '<div class="aa-card"><div class="aa-card-title">When you work</div>' +
                '<div class="aa-tod">' + todBars + '</div>' +
                '<div class="aa-tod-labels">' + todLabels + '</div>' +
            '</div>' +
            '<div class="aa-card"><div class="aa-card-title">Weekly streaks</div>' + streakHtml + '</div>' +
        '</div>' +
        '<div class="aa-card" style="margin-top:16px">' +
            '<div class="aa-card-title">Your habits <select class="aa-app-select" id="aa-heatmap-app" onchange="loadHeatmap()">' + heatmapOpts + '</select></div>' +
            '<div class="aa-heatmap-wrap" id="aa-heatmap"></div>' +
        '</div>';

    var hashApp = (location.hash || '').replace(/^#app=/, '');
    if (hashApp) {
        var sel = document.getElementById('aa-heatmap-app');
        if (sel) sel.value = decodeURIComponent(hashApp);
    }
    loadHeatmap();
}

async function loadHeatmap() {
    var sel = document.getElementById('aa-heatmap-app');
    if (!sel || !sel.value) return;
    var app = sel.value;
    history.replaceState(null, '', location.pathname + '#app=' + encodeURIComponent(app));
    try {
        var data = await EOS.api('/app-analytics/api/heatmap?app=' + encodeURIComponent(app) + '&days=90');
        EOS_UI.heatmap('aa-heatmap', data, 90);
    } catch(e) {}
}

/* ═══════════════ PRODUCTIVITY SPLIT ═══════════════ */
/* Dark by default — /api/productivity answers {enabled:false} until
   [apps.app-analytics] feature.productivity-split.enabled = true, and this
   section then renders nothing at all. A real failure still shows an error
   state; only the deliberate off-state is silent. */

// EOS_UI.statusBadge owns the class concatenation (shared-frontend rule).
var AA_PR_STATUS_MAP = { productive: 'completed', neutral: 'draft', personal: 'idea' };
var AA_PR_ORDER = ['productive', 'neutral', 'personal'];
var _prData = null;

async function loadProductivity() {
    var mount = document.getElementById('aa-productivity');
    if (!mount) return;
    var d = await EOS.apiSafe('/app-analytics/api/productivity?days=30');
    if (d && d.error) {
        mount.innerHTML = '<div class="aa-card" style="margin-top:16px">' +
            EOS_UI.errorState({ message: 'Could not load the productivity split.' }) + '</div>';
        return;
    }
    if (!d || !d.enabled) { mount.innerHTML = ''; return; }
    _prData = d;
    renderProductivity(d);
}

function renderProductivity(d) {
    var labels = d.labels || {};
    var totals = d.totals || {};
    var total = d.total || 0;

    if (!total) {
        document.getElementById('aa-productivity').innerHTML =
            '<div class="aa-card" style="margin-top:16px"><div class="aa-card-title">Productive vs personal</div>' +
            EOS_UI.emptyState({ message: 'No app views recorded in the last ' + d.days + ' days yet.' }) +
            '</div>';
        return;
    }

    var segs = '', legend = '';
    AA_PR_ORDER.forEach(function(c) {
        var n = totals[c] || 0;
        var pct = total ? (n / total * 100) : 0;
        if (pct > 0) {
            segs += '<div class="aa-pr-seg aa-pr-seg-' + c + '" style="width:' + pct.toFixed(2) + '%" ' +
                'title="' + escAttr((labels[c] || c) + ': ' + n + ' views') + '"></div>';
        }
        legend += '<span><span class="aa-pr-key aa-pr-seg-' + c + '"></span>' +
            esc(labels[c] || c) + ' — ' + n + ' (' + pct.toFixed(0) + '%)</span>';
    });

    var daily = d.daily || [];
    var dayMax = 1;
    daily.forEach(function(r) {
        dayMax = Math.max(dayMax, AA_PR_ORDER.reduce(function(a, c) { return a + (r[c] || 0); }, 0));
    });
    var daysHtml = daily.map(function(r) {
        var sum = AA_PR_ORDER.reduce(function(a, c) { return a + (r[c] || 0); }, 0);
        var h = Math.max(2, Math.round(sum / dayMax * 54));
        var inner = AA_PR_ORDER.map(function(c) {
            var part = sum ? Math.round((r[c] || 0) / sum * h) : 0;
            return part > 0
                ? '<div class="aa-pr-day-seg aa-pr-seg-' + c + '" style="height:' + part + 'px"></div>'
                : '';
        }).join('');
        return '<div class="aa-pr-day" style="height:' + h + 'px" title="' +
            escAttr(r.date + ' — ' + sum + ' views') + '">' + inner + '</div>';
    }).join('');

    var rows = (d.apps || []).slice(0, 15).map(function(r) {
        var opts = AA_PR_ORDER.map(function(c) {
            return '<option value="' + escAttr(c) + '"' + (c === r['class'] ? ' selected' : '') + '>' +
                esc(labels[c] || c) + '</option>';
        }).join('');
        return '<tr><td>' + esc(r.name || r.app) + '</td>' +
            '<td>' + EOS_UI.statusBadge(labels[r['class']] || r['class'], r['class'], AA_PR_STATUS_MAP) +
            (r.source === 'inferred' ? ' <span style="font-size:11px;color:var(--text-muted)">guessed</span>' : '') +
            '</td>' +
            '<td class="num">' + r.views + '</td>' +
            '<td><select class="aa-pr-select" aria-label="' + escAttr('Classify ' + (r.name || r.app)) +
            '" onchange="setAppClass(' + EOS_UI.jsArg(r.app) + ', this.value)">' + opts +
            '<option value="">Auto (guess)</option></select></td></tr>';
    }).join('');

    document.getElementById('aa-productivity').innerHTML =
        '<div class="aa-card" style="margin-top:16px">' +
            '<div class="aa-card-title">Productive vs personal (last ' + d.days + ' days)</div>' +
            '<div class="aa-pr-head"><span class="aa-pr-pct">' + d.productive_pct + '%</span>' +
                '<span class="aa-pr-sub">of ' + d.total + ' app views were productive</span></div>' +
            '<div class="aa-pr-track">' + segs + '</div>' +
            '<div class="aa-pr-legend">' + legend + '</div>' +
            '<div class="aa-pr-days">' + daysHtml + '</div>' +
            '<table class="aa-table" style="margin-top:16px">' +
                '<tr><th>App</th><th>Class</th><th class="num">Views</th><th>Change</th></tr>' +
                rows +
            '</table>' +
        '</div>';
}

async function setAppClass(app, cls) {
    try {
        await EOS.post('/app-analytics/api/productivity/classify', { app: app, 'class': cls });
        EOS_UI.toast(cls ? 'Reclassified as ' + cls + '.' : 'Back to the guess.');
        await loadProductivity();
    } catch (e) {
        EOS_UI.toast('Could not reclassify that app.', 'error');
    }
}

/* ═══════════════ VAULT TAB ═══════════════ */

var _vaultLoaded = false;
var _vaultStructure = null;

function vaFileList(items, metaFn) {
    if (!items.length) return '<div class="va-empty">No files</div>';
    return '<div class="va-file-list">' + items.map(function(f) {
        return '<div class="va-file-item"><span class="va-file-name">' + esc(f.path) + '</span><span class="va-file-meta">' + metaFn(f) + '</span></div>';
    }).join('') + '</div>';
}

async function loadVault() {
    if (_vaultLoaded) return;
    _vaultLoaded = true;
    try {
        var [stats, recent, largest, stale, structure] = await Promise.all([
            EOS.api('/app-analytics/api/vault/stats'),
            EOS.api('/app-analytics/api/vault/recent?limit=20'),
            EOS.api('/app-analytics/api/vault/largest?limit=20'),
            EOS.api('/app-analytics/api/vault/stale?days=90&limit=20'),
            EOS.apiSafe('/app-analytics/api/vault-structure'),
        ]);
        _vaultStructure = (structure && !structure.error) ? structure.sweep : null;
        renderVault(stats, recent, largest, stale);
    } catch(e) {
        document.getElementById('va-content').innerHTML = EOS_UI.errorState({message: 'Failed to load vault data', onRetry: 'loadVault()'});
    }
}

function renderVault(stats, recent, largest, stale) {
    var heroHtml =
        '<div class="va-hero">' +
            '<div class="va-hero-card"><div class="va-hero-val">' + (stats.total_files || 0).toLocaleString() + '</div><div class="va-hero-lbl">Total Files</div></div>' +
            '<div class="va-hero-card"><div class="va-hero-val">' + (stats.total_size_mb || 0) + ' MB</div><div class="va-hero-lbl">Total Size</div></div>' +
            '<div class="va-hero-card"><div class="va-hero-val">' + Object.keys(stats.para || {}).length + '</div><div class="va-hero-lbl">PARA Folders</div></div>' +
        '</div>';

    var paraEntries = Object.entries(stats.para || {});
    var maxCount = Math.max(1, ...paraEntries.map(function(e) { return e[1].count; }));
    var paraHtml = paraEntries.map(function(e) {
        var label = e[0], d = e[1];
        return '<div class="va-para-bar">' +
            '<span class="va-para-label">' + esc(label) + '</span>' +
            '<div class="va-para-track"><div class="va-para-fill" style="width:' + (d.count / maxCount * 100).toFixed(1) + '%"></div></div>' +
            '<span class="va-para-count">' + d.count + ' / ' + d.size_mb + 'MB</span>' +
        '</div>';
    }).join('');

    var recentHtml = vaFileList(recent, function(f) {
        var d = new Date(f.modified * 1000);
        return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    });
    var largestHtml = vaFileList(largest, function(f) { return f.size_kb + ' KB'; });
    var staleHtml = vaFileList(stale, function(f) { return f.days_stale + 'd ago'; });

    document.getElementById('va-content').innerHTML =
        heroHtml +
        '<div class="va-section-title">PARA Distribution</div>' +
        '<div id="va-para-bars">' + paraHtml + '</div>' +
        '<div class="va-section-title">Files</div>' +
        '<div class="eos-tabs">' +
            '<div class="eos-tab active" data-tab="va-recent" onclick="EOS_UI.switchTab(\'va-recent\')">Recent</div>' +
            '<div class="eos-tab" data-tab="va-largest" onclick="EOS_UI.switchTab(\'va-largest\')">Largest</div>' +
            '<div class="eos-tab" data-tab="va-stale" onclick="EOS_UI.switchTab(\'va-stale\')">Stale (90d+)</div>' +
        '</div>' +
        '<div id="tab-va-recent" class="eos-tab-content active">' + recentHtml + '</div>' +
        '<div id="tab-va-largest" class="eos-tab-content">' + largestHtml + '</div>' +
        '<div id="tab-va-stale" class="eos-tab-content">' + staleHtml + '</div>' +
        '<div class="va-section-title">Vault structure health</div>' +
        '<div id="va-structure-panel"></div>';
    renderVaultStructure();
}

// app-analytics-vault-structure-purge-action: the one-click fix/purge for
// vault-health findings (empty dirs, sync-conflict dupes, aged zero-byte
// files) that scripts/check_vault_structure.py already detects but, before
// this, could only be acted on from a terminal. "Review" items are never
// purge-eligible by design — this only ever touches the 'safe' class.
// EOS_UI.statusBadge owns the class concatenation (never build
// 'eos-badge-status-' + x by hand — see .claude/rules/shared-frontend.md).
var VA_STRUCTURE_STATUS_MAP = { safe: 'draft', 'safe-clear': 'completed', review: 'blocked', 'review-clear': 'completed' };
function renderVaultStructure() {
    var mount = document.getElementById('va-structure-panel');
    if (!mount) return;
    var s = _vaultStructure;
    var status, purgedNote = '';
    if (!s) {
        status = '<div class="va-structure-meta">Not checked yet.</div>';
    } else {
        var safe = s.safe_count || 0;
        var review = s.review_count || 0;
        var when = s.ts ? new Date(s.ts).toLocaleString() : 'unknown';
        status = '<div class="va-structure-status">' +
            EOS_UI.statusBadge(safe + ' auto-fixable', safe ? 'safe' : 'safe-clear', VA_STRUCTURE_STATUS_MAP) +
            EOS_UI.statusBadge(review + ' need review', review ? 'review' : 'review-clear', VA_STRUCTURE_STATUS_MAP) +
            '<span class="va-structure-meta">checked ' + esc(when) + '</span>' +
            '</div>';
        if (s.purged) {
            purgedNote = '<div class="va-structure-meta">Last purge removed ' +
                (s.purged.files_deleted || 0) + ' file(s), ' + (s.purged.dirs_deleted || 0) +
                ' dir(s)' + (s.purged.snapshot ? ' — snapshot: ' + esc(s.purged.snapshot) : '') +
                '.</div>';
        }
    }
    var purgeBtn = (s && s.safe_count)
        ? '<button class="eos-btn eos-btn-sm eos-btn-danger" type="button" title="Remove the auto-fixable items (a snapshot is taken first)" onclick="purgeVaultStructure()">Purge ' + s.safe_count + ' safe item(s)</button>'
        : '';
    mount.innerHTML = status + purgedNote +
        '<div class="va-structure-actions">' +
        '<button class="eos-btn eos-btn-sm" type="button" title="Re-scan the vault for structural drift" onclick="checkVaultStructure()">Check now</button>' +
        purgeBtn +
        '</div>';
}
async function checkVaultStructure() {
    EOS_UI.toast('Scanning vault structure…');
    try {
        var res = await EOS.post('/app-analytics/api/vault-structure/scan', {});
        _vaultStructure = res;
        renderVaultStructure();
        EOS_UI.toast(res.message || 'Scan complete.');
    } catch (e) {
        EOS_UI.toast('Vault structure scan failed.', 'error');
    }
}
async function purgeVaultStructure() {
    var s = _vaultStructure;
    if (!s || !s.safe_count) return;
    var ok = await EOS_UI.confirm({
        title: 'Purge vault structure drift',
        message: 'Remove ' + s.safe_count + ' auto-fixable item(s) — empty folders, byte-identical ' +
            'sync-conflict copies, aged zero-byte files? A snapshot is taken first, and the ' +
            (s.review_count || 0) + ' item(s) needing review are never touched.',
        action: 'Purge',
        danger: true,
    });
    if (!ok) return;
    EOS_UI.toast('Purging…');
    try {
        var res = await EOS.post('/app-analytics/api/vault-structure/purge', {});
        _vaultStructure = res;
        renderVaultStructure();
        var purged = res.purged || {};
        EOS_UI.toast('Purged ' + (purged.files_deleted || 0) + ' file(s), ' + (purged.dirs_deleted || 0) + ' dir(s).');
    } catch (e) {
        EOS_UI.toast('Purge failed.', 'error');
    }
}

/* ═══════════════ SETTINGS ═══════════════ */

var _appSettings = EOS_UI.settingsPanel({
    id: 'app-settings-panel',
    title: 'App Analytics Settings',
    fields: [
        { key: 'app-analytics.retention_days', label: 'Retention (days)', type: 'number', default: 365,
          hint: 'Delete usage data older than this.' },
    ],
});
function openAppSettings() { _appSettings.open(); }

loadUsage();
loadProductivity();
EOS_UI.modelPill({app: 'app-analytics', mount: '#aa-model-pill', domain: 'text'});
</script>
