[app]
id = "app-analytics"
store_category = "meta"
name = "App Analytics"
version = "3.0.0"
description = "Personal usage tracking + vault health — which apps you use, when, and what to fix or delete"
dimensions = ["occupational"]
# Optional, read by app-analytics' productivity split: "productive" |
# "neutral" | "personal". Every app is classified without declaring this
# (inferred from store_category + dimensions, and the user can override
# any app from the UI) — declare it only when the inference is wrong.
productivity = "productive"

[app.entry]
module = "app"
class = "AppAnalyticsApp"

[requires]
capabilities = ["think"]
apps = []

[provides.cli]
commands = ["analytics", "vault"]

[provides.web]
prefix = "/app-analytics"

[provides.events]
emits = ["app-analytics:productivity_classified"]
# This app's own UI is the only consumer today — but it still belongs in
# `emits`, or the topology graph builds no node for it (CLAUDE.md).
internal = ["app-analytics:productivity_classified"]

[provides.settings]
schema = [
    {key = "app-analytics.retention_days", label = "Retention (days)", type = "number", default = 365, hint = "Delete usage data older than this"},
]

# Ambient discovery — dormant-but-relevant apps the user used before and has
# forgotten. Deterministic (usage + cluster affinity + vault interest tags).
[[contributes.hub.panel]]
id = "worth-a-look"
title = "Worth a look"
method = "panel_worth_a_look"
renderer = "plain-list"
priority = 950
lazy = true

[[contributes.hub.panel]]
id = "app-analytics-ai-digest"
method = "panel_ai_digest"
renderer = "text-card"
priority = 960
lazy = true
