[app]
id = "app-analytics"
store_category = "meta"
name = "App Analytics"
version = "3.0.0"
description = "Personal usage tracking + vault health — which apps you use, when, and what to fix or delete"
dimensions = ["occupational"]

[app.entry]
module = "app"
class = "AppAnalyticsApp"

[requires]
capabilities = ["think", "search"]
apps = []

[provides.cli]
commands = ["analytics", "vault"]

[provides.web]
prefix = "/app-analytics"

[provides.events]
emits = []

[provides.settings]
schema = [
    {key = "app-analytics.retention_days", label = "Retention (days)", type = "number", default = 365, hint = "Delete usage data older than this"},
]

# Ambient discovery — dormant-but-relevant apps the user used before and has
# forgotten. Deterministic (usage + cluster affinity + vault interest tags).
[[contributes.hub.panel]]
id = "worth-a-look"
title = "Worth a look"
method = "panel_worth_a_look"
renderer = "plain-list"
priority = 950
lazy = true
