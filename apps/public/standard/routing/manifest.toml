[app]
id = "routing"
store_category = "meta"
name = "Routing"
version = "1.0.0"
description = "Multi-stop route planning via OSRM. Free, cached, rate-limited. Pairs with geocode + EOS_MAP for trip planning from vault data."
dimensions = ["environmental"]

[app.entry]
module = "app"
class = "RoutingApp"

[requires]
capabilities = []

[provides.web]
prefix = "/routing"

[provides.events]
emits = ["routing:planned", "routing:trip_saved", "routing:trip_deleted"]

[provides.settings]
schema = [
    {key = "routing.cost_per_km", label = "Cost estimate ($/km)", type = "number", default = 0.15, hint = "Fuel/running-cost estimate applied to a planned route's distance. Set to 0 to hide cost estimates."},
]
