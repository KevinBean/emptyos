[app]
id = "assistant"
icon_id = "assistant"
store_category = "ai"
name = "Assistant"
version = "3.0.0"
description = "AI chat — vault integration, multi-agent compare, voice I/O, PWA"

[app.entry]
module = "app"
class = "AssistantApp"

[requires]
optional_apps = ["jobs"]
capabilities = ["think", "read", "write", "search", "speak", "listen", "browse"]
apps = ["search", "quick-action", "projects", "journal"]

[provides.cli]
commands = ["ask"]

[provides.web]
prefix = "/assistant"

[provides.events]
emits = ["assistant:message", "assistant:reconcile_applied"]
# Reconcile lands in the vault note via the diff gate — that IS the record — no cross-app listener by design.
internal = [
    "assistant:reconcile_applied",
]

[provides.settings]
schema = [
    {key = "assistant.default_backend", label = "Default Backend", type = "select", options = ["auto", "ollama", "claude-cli", "openai"], default = "auto"},
    {key = "assistant.vault_context", label = "Inject Vault Context", type = "toggle", default = true},
    {key = "assistant.use_tools", label = "Use Read-Only Tools for Retrieval", type = "toggle", default = false, hint = "Model drives Read/Grep/Glob itself instead of keyword-search injection. Higher quality, ~3x slower."},
    {key = "assistant.max_history", label = "Max Messages per Session", type = "number", default = 200},
    {key = "assistant.feature.assistant-cross-session-memory.enabled", label = "Recall exported chats in new sessions", type = "toggle", default = false, hint = "Dark by default. Stores a compact Assistant-owned episode when a chat is exported or auto-archived, then recalls up to three relevant episodes on the first turn of a new chat."},
    {key = "assistant.feature.passage-citations.enabled", label = "Cite the exact passage, not just the note", type = "toggle", default = false, hint = "Dark by default. Names the section of each cited note that matched your question, and lets the citation chip expand that passage inline instead of opening the whole note."},
]
