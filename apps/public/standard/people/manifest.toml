[app]
id = "people"
store_category = "productivity"
name = "People"
version = "1.1.0"
description = "Person directory — roster, capacity, workload, relationships, birthdays, interactions. Absorbs the former contacts app."
dimensions = ["occupational", "social"]

[app.entry]
module = "app"
class = "PeopleApp"

[requires]
capabilities = ["read", "write", "search", "think"]
optional_apps = ["voice-assistant", "staff"]

[provides.cli]
commands = ["people"]

[provides.web]
prefix = "/people"

[provides.events]
emits = [
    "people:created", "people:updated", "people:archived", "people:logged",
    "contacts:created", "contacts:edited", "contacts:logged",
    "contacts:enriched", "contacts:chat_archived", "people:message_composed",
]
# Compose observability — no cross-app listener by design.
internal = [
    "people:message_composed",
]
listens = ["people:assigned", "people:unassigned"]

[provides.export]
enabled = true
mode = "standalone"
# Ship only what the pages use — no optional bundle is referenced by its pages. Undeclared means EVERY bundle
# (hands-free + assistant + keys + maps + realtime), which put the shared
# _assets/ at 869 KB against the 800 KB guard in tests/test_sys_export.py.
assets = ["minimal"]
hook = "export"
fallbacks = [
    "vault:indexeddb",
    "events:local-bus",
    "call_app:stub",
    "viewer:none",
]

[provides.assistant]
commands = [
    {slash = "/people", method = "list_people"},
    {slash = "/delegate", method = "delegate_from_text", arg = "task"},
]

# ── Verb registry — voice surface only. The /people assistant slash stays on
# its own surface (all-or-nothing is per app+surface, .claude/rules/verb-registry.md).
[[provides.verbs]]
verb = "people.lookup"
method = "voice_lookup"
summary = "Look up a person by name"
args = { query = "string" }
eligibility = "stable"
surfaces = ["voice"]
voice = { method = "voice_lookup", example = "who is Tom", description = "Find a person by name and show their card (role, company, last contact). query = the name or a fragment of it.", card = "entity-card" }

[[provides.verbs]]
verb = "people.log_interaction"
method = "voice_log_interaction"
summary = "Log a catch-up / interaction on a person's note"
args = { person = "string", text = "string?" }
eligibility = "gated"
surfaces = ["voice"]
voice = { method = "voice_log_interaction", example = "log that I caught up with Tom about the DC role", description = "Record an interaction on a person's note and bump last-contact. person = their name; text = what happened. If text is missing, a small form asks for it.", card = "form" }

[[provides.verbs]]
verb = "people.delegate"
method = "delegate_from_text"
summary = "Decide who or what should do a task — you, a contact, or an AI"
args = { task = "string" }
eligibility = "stable"
surfaces = ["voice"]
voice = { method = "voice_delegate", example = "who should write the quarterly report", description = "Given a task, recommend whether to do it yourself, hand it to a contact, or delegate it to an AI model/agent, with a one-line reason. task = what needs doing.", card = "entity-card" }

[provides.settings]
schema = [
    {key = "people.folder", label = "Vault folder", type = "text", default = "30_Resources/People", hint = "Where person notes live"},
    {key = "people.default_capacity_hours", label = "Default capacity (h/wk)", type = "number", default = 40},
    {key = "people.overdue_alert", label = "Overdue contact alerts", type = "toggle", default = true, hint = "Surface overdue contacts in notifications"},
    {key = "people.birthday_alert_days", label = "Birthday alert (days before)", type = "number", default = 7},
    {key = "people.feature.people-birthday-push.enabled", label = "Push birthday reminders", type = "toggle", default = false, hint = "Dark by default. Runs a daily sweep and routes one reminder per person/year through the proactive notification gate."},
    {key = "people.feature.pattern-voice.enabled", label = "Apply my voice patterns to drafts", type = "toggle", default = false, hint = "Dark by default. When on, composed messages layer your own voice directives (from your behavior-pattern records) on top of the generic networking principles."},
]

[provides.timeline]
entity_source = "person_path"

[[contributes.hub.panel]]
id = "people-overloaded"
method = "panel_overloaded"
renderer = "chips"
priority = 140
group = "dashboard"

[[contributes.hub.panel]]
id = "reach-out"
title = "🤝 Stay in touch"
method = "panel_reach_out"
renderer = "plain-list"
priority = 150
limit = 5

[[contributes.hub.panel]]
id = "birthdays"
title = "🎂 Birthdays"
method = "panel_birthdays"
renderer = "plain-list"
priority = 230
