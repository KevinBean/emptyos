[app]
id = "trust-loop"
name = "Trust Loop"
version = "1.0.0"
description = "Trustworthy-engineering showcase — IEEE 80 tolerable touch/step voltages behind a live conformance gate, with the working shown and every number cited"
dimensions = ["occupational"]
store_category = "engineering"

[app.entry]
module = "app"
class = "TrustLoopApp"

[provides.cli]
commands = ["trust-loop"]

[provides.web]
prefix = "/trust-loop"

[requires]
capabilities = []
apps = []
optional_apps = ["kb"]

# Method registry — the calculator framework's contract surface. One method:
# the standard's own closed forms, pure and deterministic (ieee80.py). No
# model call sits anywhere on the compute path.
[[provides.methods.tolerable]]
id = "ieee80_closed_form"
label = "IEEE 80 closed form"
default = true
fn = "_calc_tolerable"
version = "1.0.0"
description = "Tolerable touch/step voltages from the standard's published closed forms — body-current factor, surface-layer derating C_s, series body-circuit resistances."
references = ["[[ieee-80-touch-step-voltages]]"]

# Conformance — the gate the article calls the load-bearing wall. The case is
# the standard's own published example; the engine must reproduce it within
# 0.5% or the calculator has no business shipping.
[[provides.conformance.tolerable]]
case_id = "ieee80-50kg-rho100-t05"
label = "IEEE 80 published case — 50 kg, rho=100 ohm-m, t=0.5 s, no surface layer (188.65 V touch / 262.48 V step)"
inputs_fn = "_conf_ieee80_inputs"
expected_fn = "_conf_ieee80_expected"
methods = ["ieee80_closed_form"]
tolerances = { default_pct = 0.5 }
references = ["[[ieee-80-touch-step-voltages]]"]

[provides.welcome]
title = "Trust Loop"
tagline = "How an engineering calculator earns trust — live, with receipts."
href = "/trust-loop/"
order = 45
