[app]
id = "company"
name = "Orgs"
version = "0.3.0"
description = "One Org primitive covering real teams, virtual sims, target employers, and mixed. Members can be humans (linked to apps/people/) or AI personas. Scenarios (critique / workshop / interview) operate on the AI members of any org."
store_category = "productivity"
dimensions = ["intellectual", "occupational"]

[app.entry]
module = "app"
class = "CompanyApp"

[requires]
capabilities = ["read", "write", "think"]
# `rooms` is used by in-room scenario mode + persona mirror.
# `people` is used to resolve `person_id` on human members.
apps = ["rooms", "people", "kb"]

[provides.cli]
commands = ["company"]

[provides.web]
prefix = "/orgs"

[provides.events]
# Real-org lifecycle — creating/archiving an org or adding a member is
# news the reactor should journal. Kept in `emits` for cross-app listeners.
emits = [
    "orgs:org_created",
    "orgs:org_updated",
    "orgs:org_archived",
    "orgs:member_added",
    "orgs:member_updated",
    "orgs:member_removed",
    # Listed here as well as in `internal` below because `internal` is a
    # MODIFIER on `emits`, not an alternative to it: topology.py walks
    # `emits` and only consults `internal` to flag those edges. A name in
    # `internal` alone produces no node and no edge — these four were
    # invisible to /api/topology, so the graph undercounted this app.
    "company:run_started",
    "company:run_complete",
    "company:action_applied",
    "company:action_rejected",
    "company:specialist_routed",
]
# Scenario-sim run lifecycle — drives the persona-sim UI's run records
# and review-gate cards. Names retained from the persona-sim era for
# back-compat with the run-record schema. Internal-only by design.
internal = [
    "company:run_started",
    "company:run_complete",
    "company:action_applied",
    "company:action_rejected",
    "company:specialist_routed",
    "orgs:member_added",
    "orgs:member_removed",
    "orgs:member_updated",
    "orgs:org_archived",
    "orgs:org_created",
    "orgs:org_updated",
]

# ── Unified verb registry — see .claude/rules/verb-registry.md ──
[[provides.verbs]]
verb = "company.route_to_specialist"
method = "route_to_specialist"
summary = "Route one item to the best-fit AI specialist on an org"
args = { org_id = "string", item_text = "string" }
eligibility = "gated"
surfaces = ["agent", "mcp"]

[provides.settings]
schema = [
    {key = "company.default_model", label = "Default AI Member Model", type = "select", options = ["", "ollama", "openai", "claude-cli"], default = ""},
    {key = "company.parallel_fanout", label = "Parallel Fan-Out", type = "boolean", default = true},
    {key = "company.scenario_timeout_s", label = "Per-Member Timeout (s)", type = "number", default = 120},
    {key = "company.digest_enabled", label = "Generate Digest", type = "boolean", default = true},
]
