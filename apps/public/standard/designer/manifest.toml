[app]
id = "designer"
name = "Designer"
version = "1.0.0"
description = "AI UI/web-page designer. Describe a page and pick a design system (\"make it look like Linear\") to get a styled, standalone HTML mockup. Sibling to viz — where viz makes explainer artifacts (charts, diagrams, 3D), designer makes page-level UI and embeds viz artifacts where the model marks them."
dimensions = ["intellectual"]
store_category = "creative"

[app.entry]
module = "app"
class = "DesignerApp"

[requires]
# `artifact` is one of the 13 core capabilities (always registered); designer
# consumes it via self.artifact() to bake in viz charts/diagrams. The PROVIDER
# (viz) is optional — embed.py catches a missing provider and degrades to a
# styled fallback, so declaring the capability never blocks load.
capabilities = ["think", "read", "write", "artifact"]
apps = ["kb"]
# viz is OPTIONAL: designer embeds viz artifacts (charts/diagrams/3D) via the
# `artifact` capability when the user leaves a placeholder div, but a page with
# no rich elements (or with embedding off) generates fine without it.
optional_apps = ["viz"]
services = []
events = []

[provides.cli]
commands = ["designer"]

[provides.web]
prefix = "/designer"

# ✨ AI field-suggest (see .claude/rules/field-suggest.md)
[[provides.field_suggest]]
field = "prompt"
instruction = "Propose concrete one-line web-page briefs riffing on the user's knowledge-base topics — each names the page's purpose and a few sections, ready to generate and edit."
vault_tags = ["kb"]
title_only = true
count = 5
mode = "fill"

[provides.events]
emits = [
    "designer:created",
    "designer:updated",
    "designer:rendered",
]
listens = []
internal = [
    "designer:created",
    "designer:updated",
    "designer:rendered",
]

[provides.timeline]
entity_source = "artifact_path"

[provides.settings]
schema = [
    {key = "designer.embed_viz", label = "Embed viz elements", type = "boolean", default = true, hint = "When on, data-viz placeholder divs the model leaves are filled with real viz artifacts (charts, diagrams, 3D) baked inline. Turn off for pure-HTML pages."},
    {key = "designer.max_embeds", label = "Max embedded elements", type = "number", default = 4, hint = "Cap on how many viz artifacts one page may embed. Each adds an LLM call + page size."},
    {key = "designer.max_html_kb", label = "Max HTML size (KB)", type = "number", default = 384, hint = "Refuse to save designs larger than this. Higher than viz's default because baked-in viz artifacts add size."},
    {key = "designer.think_domain", label = "Think domain", type = "select", default = "code", options = ["code", "text", "reason"], hint = "Routing hint for the think capability — `code` favours providers tuned for HTML/CSS output."},
]

[provides.welcome]
title = "AI Web-Page & UI Designer"
tagline = "Describe a page, pick a design system, get a styled standalone mockup — charts and diagrams generated by viz, baked in."
href = "/designer/"
order = 21

[[contributes.work.deliverable]]
id = "web-page"
label = "Web page"
icon = "🌐"
description = "A styled standalone web page or UI mockup."
method = "deliver_work"
iterate = "iterate"
