[app]
id = "github-connector"
store_category = "dev"
name = "GitHub Connector"
version = "1.0.0"
description = "Sync GitHub issues and PRs into EmptyOS projects"
dimensions = ["occupational"]

[app.entry]
module = "app"
class = "GitHubConnectorApp"

[requires]
capabilities = ["read", "write"]
# projects is the write target for "import as task" — soft dependency so the
# connector degrades to read-only sync if projects isn't installed.
optional_apps = ["projects"]

[provides.cli]
commands = ["github"]

[provides.web]
prefix = "/github-connector"

[provides.project-tools]
tools = [
    {id = "sync-issues", label = "Sync GitHub Issues", method = "api_sync_issues", type = "development"},
    {id = "pr-status", label = "PR Status", method = "api_pr_status", type = "development"},
]

[provides.events]
emits = ["github:synced", "github:pr_status", "github:issue_imported"]

# Pure reads (no mutation on GitHub or in EmptyOS) — eligibility="stable" so a
# generic automation (apps/public/labs/workflows/) may auto-run them unattended.
# Verb app-half is "github-connector" (must equal the app id — CLAUDE.md
# .claude/rules/verb-registry.md's cross-app guard).
[[provides.verbs]]
verb = "github-connector.sync_issues"
method = "sync_issues"
summary = "Fetch open GitHub issues for a repo"
args = { repo = "string?" }
eligibility = "stable"
surfaces = ["agent"]

[[provides.verbs]]
verb = "github-connector.pr_status"
method = "pr_status"
summary = "Fetch open GitHub pull requests for a repo"
args = { repo = "string?" }
eligibility = "stable"
surfaces = ["agent"]

[[provides.verbs]]
verb = "github-connector.import_issue_as_task"
method = "import_issue_as_task"
summary = "Create an EmptyOS project task from one GitHub issue"
args = { repo = "string?", number = "number", project = "string?" }
eligibility = "stable"
surfaces = ["agent"]

[provides.settings]
schema = [
    {key = "github.token", label = "GitHub Token", type = "password", default = ""},
    {key = "github.default_repo", label = "Default Repo (owner/repo)", type = "text", default = ""},
]
