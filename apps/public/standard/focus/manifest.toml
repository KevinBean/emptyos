[app]
id = "focus"
store_category = "productivity"
name = "Focus"
version = "1.0.0"
description = "Pomodoro focus timer with task suggestions"
icon = "🎯"
dimensions = ["occupational"]

[app.entry]
module = "app"
class = "FocusApp"

[requires]
capabilities = ["think", "write"]
apps = ["task"]

[provides.cli]
commands = ["focus"]

[provides.web]
prefix = "/focus"

[provides.events]
emits = ["focus:completed"]

[provides.settings]
schema = [
    {key = "focus.daily_goal", label = "Sessions per Day", type = "number", default = 4},
    {key = "focus.work_min", label = "Work Duration (min)", type = "number", default = 25},
    {key = "focus.break_min", label = "Break Duration (min)", type = "number", default = 5},
    {key = "focus.long_break_min", label = "Long Break (min)", type = "number", default = 15},
]

[provides.assistant]
commands = [
    {slash = "/focus", method = "suggest_task"},
    {slash = "/focus-done", method = "complete_session"},
    {slash = "/focus-stats", method = "today_stats"},
]

# ── Unified verb registry (see .claude/rules/verb-registry.md) ──
# Voice path to the same abilities the page's rail buttons expose
# (start_timer / get_suggestion) — a spoken "start a 25-minute focus
# session" must not dead-end just because the /focus/ page isn't open.
[[provides.verbs]]
verb = "focus.start"
method = "voice_start_focus"
summary = "Start a focus (pomodoro) session"
args = { minutes = "number?" }
eligibility = "stable"
surfaces = ["voice"]
voice = { example = "start a 25 minute focus session", description = "Start a focus/pomodoro session. minutes optional — defaults to the configured work duration. Also schedules a time's-up notification.", always = true }

[[provides.verbs]]
verb = "focus.suggest"
method = "voice_suggest_task"
summary = "Suggest what to focus on next"
args = {}
eligibility = "stable"
surfaces = ["voice"]
voice = { example = "what should I focus on", description = "Pick the single best open task for the next focus session, with a one-clause reason." }

[[provides.verbs]]
verb = "focus.complete"
method = "voice_complete_focus"
summary = "Log the just-finished focus session"
args = { task = "string?" }
eligibility = "stable"
surfaces = ["voice"]
voice = { example = "I finished my focus session", description = "Log the focus session that just ended (duration is validated against the recorded start). task optional — what was worked on." }

[[contributes.hub.panel]]
id = "focus-today"
method = "panel_focus_today"
renderer = "stat-tile"
group = "dashboard"
priority = 150

[[contributes.voice-assistant.context]]
id = "focus-status"
method = "assistant_context"
priority = 80
