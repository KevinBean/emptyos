[app]
id = "reactor"
store_category = "meta"
name = "Reactor"
version = "1.0.0"
description = "Event chain reactions — the system's metabolism"

[app.entry]
module = "app"
class = "ReactorApp"

[requires]
capabilities = ["think"]
apps = ["journal", "expense", "app-builder"]
# briefing is a listened-for emitter only. Reactor is purely event-driven —
# when emitters aren't installed, their events simply don't fire and the
# matching reactors stay quiet. expense is a call_app target for budget
# rollups, so it IS declared here (try/except guards keep reactor running
# when expense is absent). app-builder is called by on_project_status_changed
# when a project flips to spec-ready — same try/except shape.

[provides.cli]
commands = ["reactor"]

[provides.web]
prefix = "/reactor"

[provides.events]
emits = []
listens = [
    "vault:changed", "expense:added", "task:completed", "task:added", "task:reopened", "journal:entry", "journal:created",
    "healing:mood-logged",
