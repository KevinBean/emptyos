[app]
id = "forge"
name = "Forge"
version = "0.1.0"
description = "Scaffold and track native apps. EmptyOS as a workbench for projects whose code lives outside the daemon."
dimensions = ["occupational", "intellectual"]
store_category = "dev"

[app.entry]
module = "app"
class = "ForgeApp"

[provides.web]
prefix = "/forge"

# ✨ AI field-suggest — vault-grounded "smallest first version" seeds (see .claude/rules/field-suggest.md)
[[provides.field_suggest]]
field = "design"
instruction = "Propose concise 'smallest first version' starting points for a native app project, riffing on the shapes of the user's existing projects. Each is one or two sentences the user will edit — a scope, not a spec."
vault_tags = ["project"]
frontmatter_fields = ["status"]
title_only = true
count = 4
mode = "fill"

[provides.events]
emits = [
    "forge:scaffolded",
    "forge:dev_started",
    "forge:dev_stopped",
    "forge:built",
    "forge:released",
    "forge:deleted",
]

# Internal / UI-only emit — no cross-app listener by design.
internal = [
    "forge:deleted",
    "forge:dev_started",
    "forge:dev_stopped",
    "forge:released",
]

[requires]
capabilities = ["read", "write"]
apps = []
services = ["agent-runtime"]
events = []

[[contributes.hub.panel]]
id = "forge.projects"
method = "panel_projects"
renderer = "stat-tile"
group = "dashboard"
title = "Native projects"
priority = 220
