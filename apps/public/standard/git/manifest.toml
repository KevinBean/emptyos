[app]
id = "git"
store_category = "dev"
name = "Git"
version = "1.0.0"
description = "Version control for notes and projects"
dimensions = ["occupational"]

[app.entry]
module = "app"
class = "GitApp"

[provides.cli]
commands = ["git"]

[provides.web]
prefix = "/git"

[provides.project-tools]
tools = [
    # The request handlers, not the *_at helpers: projects' run-tool only calls
    # a tool that takes a request, and these routes carry the repo allowlist
    # (_repo_path -> emptyos | vault). params: {"repo": "vault", "count": 10}.
    {id = "git-status", label = "Git Status", method = "api_status", type = "development"},
    {id = "git-log", label = "Recent Commits", method = "api_log", type = "development"},
    {id = "git-branches", label = "Branches", method = "api_branches", type = "development"},
]

[provides.events]
emits = ["git:saved", "git:pushed", "git:pulled"]

[requires]
capabilities = ["think"]
services = []
events = []
