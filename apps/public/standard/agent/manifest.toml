[app]
id = "agent"
store_category = "ai"
name = "Coding Agent"
version = "1.0.0"
description = "Claude-Code-like coding agent — tool-use loop, permission-gated. Same brain in terminal (eos chat) and web (/agent/)."
dimensions = ["occupational", "intellectual"]

[app.entry]
module = "app"
class = "AgentApp"

[requires]
# Agent uses `think` via the provider chain (resolves tool-capable providers).
# Read/search intentionally bypass capabilities — tools need arbitrary paths
# outside the vault-scoped FilesystemReadProvider.
capabilities = ["think"]
# A chat's "Vault" context falls back to the search app's whole-vault
# embedding search when the scoped slice finds nothing (turn_inputs.py).
optional_apps = ["search", "viz"]

[provides.cli]
commands = ["chat", "code"]
interactive = ["chat", "code"]  # REPLs: must run in client process (stdin/stdout), not proxied to daemon

[provides.cli.help]
chat = "Autonomous coding agent — multi-turn tool-loop REPL (read→edit→test, plan mode, /revert). Review-gated rooms coding → eos rooms --code."
code = "Alias for eos chat — agent tool-loop in the code persona when agent modes are enabled. Review-gated rooms coding → eos rooms --code."

[provides.web]
prefix = "/agent"

# Prompt constants registered for per-machine overrides via declare_prompts()
# in prompts.py — the /prompts app imports this module to browse defaults.
[provides.prompts]
module = "prompts"

[provides.events]
emits = [
    "agent:turn_start",
    "agent:iter_start",
    "agent:text",
    "agent:tool_call",
    "agent:tool_result",
    "agent:permission_requested",
    "agent:permission_resolved",
    "agent:done",
    "agent:cancelled",
    "agent:max_iters",
    "agent:error",
    # Phase 4+ additions — turn-level + session-level signals
    "agent:compacted",        # session history was compacted (stale tool_results summarized)
    "agent:plan_mode",        # plan-mode flag changed (ws-message response)
    "agent:skill_loaded",     # /<skill-name> invocation loaded SKILL.md
    "agent:orient",           # pre-turn orient plan produced (task_type, plan, rules, criteria)
    "agent:plan_nudge",       # plan reminder injected mid-turn (iter 3+)
]

# Hub: autopilot grant re-review — stale/expiring grants + weekly fire count.
# The panel method returns None (invisible) until at least one grant or audit
# entry exists, so deployments that never use autopilot see nothing.
[[contributes.hub.panel]]
id = "autopilot-review"
title = "⚡ Autopilot"
method = "panel_autopilot_review"
renderer = "plain-list"
priority = 140
limit = 6
lazy = true

[provides.settings]
schema = [
    {key = "think.app.agent", label = "Default Provider", type = "select", options = ["anthropic_sdk", "openai", "openai-mini", "openai-nano", "ollama", "claude-cli"], default = "anthropic_sdk", hint = "Same setting as the model pill on /agent/ and `/model … save` in eos chat. openai = gpt-5.4 (full, strongest) · openai-mini = gpt-5.4-mini (best $/quality) · openai-nano = gpt-5.4-nano (cheap bulk) · claude-cli = Max subscription"},
    {key = "agent.max_iters", label = "Max Iterations per Turn", type = "number", default = 25},
    {key = "agent.tool_policy", label = "Tool Policy", type = "select", options = ["ask", "auto", "deny"], default = "ask", hint = "Global policy overlay; per-tool defaults still apply"},
]
