<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Note - EmptyOS</title>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/eos-components.css">
<style>
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100dvh; margin:0 }
.backdrop { max-width:640px; margin:0 auto; padding:48px 20px }
.backdrop h1 { font-size:20px; font-weight:600; margin:0 0 8px }
.backdrop .path { font-family:var(--mono,'Consolas',monospace); font-size:12px; color:var(--text-muted); word-break:break-all; margin-bottom:20px }
.backdrop .row { display:flex; gap:10px; flex-wrap:wrap }
.backdrop button { padding:9px 16px; background:var(--accent); color:var(--accent-ink); border:none; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer }
.backdrop button.ghost { background:var(--bg-card); color:var(--text); border:1px solid var(--border) }
</style>
</head>
<body>
<script src="/static/eos.js"></script>
<script src="/static/eos-components.js"></script>

<div class="backdrop">
  <h1 id="note-title">Note</h1>
  <div class="path" id="note-path"></div>
  <div class="row" id="note-actions" style="display:none">
    <button onclick="openNote()">Open note</button>
    <button class="ghost" onclick="EOS.openInViewer(NOTE_PATH)">Open external &#8599;</button>
    <button class="ghost" onclick="location.href='/'">Home</button>
  </div>
</div>

<script>
// Deep-link note viewer: /notes?path=<vault-relative path>
// Opens the shared EOS_UI.viewNote modal on load; this page is the backdrop
// that remains when the modal closes (Reopen / Open external / Home).
var NOTE_PATH = '';
(function () {
  var params = new URLSearchParams(location.search);
  var raw = params.get('path') || params.get('file') || '';
  var titleEl = document.getElementById('note-title');
  var pathEl = document.getElementById('note-path');

  if (!raw) {
    // /notes is a deep-link viewer — with no note to show, hand off to the
    // note-finder (search). replace() so Back doesn't trap on this shell.
    location.replace('/search/');
    return;
  }

  NOTE_PATH = EOS.normPath(raw);
  if (!/\.md$/i.test(NOTE_PATH)) NOTE_PATH += '.md';

  document.title = EOS.fileName(NOTE_PATH).replace(/-/g, ' ') + ' - EmptyOS';
  titleEl.textContent = EOS.fileName(NOTE_PATH).replace(/-/g, ' ');
  pathEl.textContent = NOTE_PATH;
  document.getElementById('note-actions').style.display = 'flex';

  openNote();
})();

function openNote() {
  if (NOTE_PATH) EOS_UI.viewNote(NOTE_PATH);
}
</script>
</body>
</html>
