# ── Release targets ───────────────────────────────────────────
# Declarative bindings consumed by `scripts/release.py <target>`. Each target
# pairs a tier with a destination repo + the gates/transform to apply. This is
# the single source of truth for "where does each daemon deployment come from".
#
#   tier            — which release.toml tier defines the app/plugin set
#   repo            — destination git repo (owner/name)
#   visibility      — public | private  (informational + safety intent)
#   strip_personal  — run check-personal.py, ABORT on any match (public only)
#   strip_branding  — run check-branding.py, ABORT on any match
#   include         — "code" | "code+portfolio" (bundle the portfolio/ dir)
#   snapshot        — "head" (git archive HEAD, tracked only)
#                   | "worktree" (copy working tree — captures untracked/WIP)
#   deploy          — how the VPS goes live (documentation; see docs/PUBLISHING.md)

[targets.public]
tier = "standard"
repo = "KevinBean/emptyos"
visibility = "public"
strip_personal = true
strip_branding = true
include = "code"
snapshot = "head"
deploy = "vps:git-reset+rebuild (demo.binbian.net)"

# EmptyOS Desktop — the double-clickable Windows program (products/desktop-windows/).
# Not a repo snapshot like the targets above: the tier tree is frozen by
# PyInstaller into an exe and shipped as a zip on GitHub Releases.
#
# Releases must land on the PUBLIC repo. Assets on a private repo are not
# anonymously downloadable, and a pilot user has no token — so the update feed
# would 404 for exactly the people it exists for.
[targets.desktop]
tier = "standard"
repo = "KevinBean/emptyos"
visibility = "public"
strip_personal = true
strip_branding = true
include = "code"
snapshot = "head"
deploy = "github-releases (zip + latest-emptyos-desktop.json)"

# ── Always included (platform layer) ─────────────────────────

[include]
paths = [
    "emptyos/",
    "engines/",  # pure compute libs many engineering apps depend on (engines/personal/ excluded below)
    "emptyos.example.toml",
    "englishos-cloud/",
    "pyproject.toml",
    "release.toml",
    "suites.toml",
    ".eos-personal",
    ".eos-branding",
    ".gitignore",
    ".github/",
    "scripts/check-personal.py",
    "scripts/check-branding.py",
    "scripts/restart_health_check.py",
    "restart.bat",
    "service.bat",
    "tests/",
    "docs/DESIGN.md",
    "docs/APPS.md",
    "docs/TIERS.md",
    "docs/DOC-SYSTEM.md",
    "docs/README.md",
    "docs/GETTING-STARTED.md",
    "docs/APP-DEVELOPMENT.md",
    "CLAUDE.md",
    "README.md",
    "LICENSE",
]

# ── Never included ────────────────────────────────────────────

[exclude]
patterns = [
    "apps/personal/",
    "engines/personal/",
    "data/",
    "emptyos.toml",
    ".claude/vault-connection.json",
    ".claude/settings.local.json",
    "boot.vbs",
    "registry.json",
    "emptyos_test.log",
    "*.pyc",
    "__pycache__/",
    ".claude/skills/",
]
