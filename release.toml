# EmptyOS Release Manifest
# Defines distribution tiers and packaging rules.
#
# Usage: python scripts/package-release.py <tier> [--check] [--platform=<name>]

[release]
version = "0.6.4"

# ── Platforms ─────────────────────────────────────────────────
# Named deployment profiles. Plugins declare compatibility in
# their manifest [platforms].supports = [...] array. Tiers with
# target_platform auto-filter incompatible plugins at package
# time. CLI --platform=<name> overrides the tier's target.

[platforms.laptop]
description = "Local dev machine — GPU, camera, mic, desktop apps"
caps = ["gpu", "camera", "mic", "desktop"]

[platforms.vps-cpu]
description = "Cloud VPS, CPU only (Hetzner CX23, DO $6 droplet)"
caps = []

[platforms.vps-gpu]
description = "Cloud GPU droplet (DO GPU, RunPod, Lambda)"
caps = ["gpu"]

[platforms.docker]
description = "Container, no hardware assumptions"
caps = []

# ── Tiers ─────────────────────────────────────────────────────

# Vocabulary:
# - core and standard are platform tiers.
# - everything else is a packaged distribution/profile for a concrete audience
#   or operating context. Distribution tiers may be private and branded without
#   changing runtime semantics; all apps are still equal once loaded.

[tiers.core]
kind = "platform"
display_name = "EmptyOS Core"
audience = "Kernel-level EmptyOS install"
description = "Minimum OS — vault basics, task management, search, generic home"
apps = [
    "hub",
    "link",
    "note",
    "providers",
    "quick-action",
    "run",
    "search",
    "settings",
    "store",
    "system-log",
    "task",
    "vault-backup",
    "weather",
]
plugins = [
    "health",
    "notifications",
]
skills = []
# Engines are NOT tier-filtered by default (they ship wholesale like emptyos/).
# This allowlist is the public-engine set: scripts/release-public.py drops every
# engines/<X> NOT listed here. It is an allowlist precisely so a new engine leaks
# nothing by default — a held engine simply never gets added.
# Keep it to generic, non-engineering engines; the power/cable engineering engines
# are held private and must NOT be added.
# NOTE: this file SHIPS in the public snapshot, so do not enumerate the held
# engines by name here. The allowlist below is the entire rule.
engines = [
    "sheet",        # public sheet app
    "articulated",  # robot/3D modeller (cadquery plugin + texture scripts)
]

# Packaging/documentation tier only; the kernel never reads tiers at runtime.
[tiers.demo]
kind = "operational"
display_name = "Demo"
audience = "Public VPS showcase"
description = "VPS showcase — core + narrative apps, cloud LLM only"
extends = "core"
target_platform = "vps-cpu"
